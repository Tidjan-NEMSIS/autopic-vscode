<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Puzzle Piece Blue Gradient -->
    <linearGradient id="puzzleGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Puzzle Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />

  <!-- Puzzle Shadow / Glow -->
  <path transform="translate(180, 220) scale(32)" fill="#0284c7" opacity="0.3" filter="url(#glow)" d="
    M 6,8 C 4.9,8 4,8.9 4,10 L 4,12 C 4.6,12 5.5,12.4 5.9,13 C 6.7,14 6.7,15 5.9,16 C 5.5,16.6 4.6,17 4,17 L 4,19 C 4,20.1 4.9,21 6,21 L 13,21 C 14.1,21 15,20.1 15,19 L 15,17 C 15.6,17 16.5,17.4 17.1,16.8 C 18.2,15.7 18.2,14.3 17.1,13.2 C 16.5,12.6 15.6,13 15,13 L 15,10 C 15,8.9 14.1,8 13,8 L 11.5,8 C 11.5,7.4 11.9,6.5 11.3,5.9 C 10.2,4.8 8.8,4.8 7.7,5.9 C 7.1,6.5 7.5,7.4 7.5,8 Z
  " />

  <!-- Puzzle Body -->
  <path transform="translate(180, 220) scale(32)" fill="url(#puzzleGrad)" d="
    M 6,8 C 4.9,8 4,8.9 4,10 L 4,12 C 4.6,12 5.5,12.4 5.9,13 C 6.7,14 6.7,15 5.9,16 C 5.5,16.6 4.6,17 4,17 L 4,19 C 4,20.1 4.9,21 6,21 L 13,21 C 14.1,21 15,20.1 15,19 L 15,17 C 15.6,17 16.5,17.4 17.1,16.8 C 18.2,15.7 18.2,14.3 17.1,13.2 C 16.5,12.6 15.6,13 15,13 L 15,10 C 15,8.9 14.1,8 13,8 L 11.5,8 C 11.5,7.4 11.9,6.5 11.3,5.9 C 10.2,4.8 8.8,4.8 7.7,5.9 C 7.1,6.5 7.5,7.4 7.5,8 Z
  " />

  <!-- Glossy Diagonal Highlight -->
  <path transform="translate(180, 220) scale(32)" fill="url(#glossGrad)" d="
    M 6,8 C 4.9,8 4,8.9 4,10 L 4,12 C 4.6,12 5.5,12.4 5.9,13 C 6.7,14 6.7,15 5.9,16 C 5.5,16.6 4.6,17 4,17 L 4,19 C 4,20.1 4.9,21 6,21 L 13,21 C 14.1,21 15,20.1 15,19 L 15,17 C 15.6,17 16.5,17.4 17.1,16.8 C 18.2,15.7 18.2,14.3 17.1,13.2 C 16.5,12.6 15.6,13 15,13 L 15,10 C 15,8.9 14.1,8 13,8 L 11.5,8 C 11.5,7.4 11.9,6.5 11.3,5.9 C 10.2,4.8 8.8,4.8 7.7,5.9 C 7.1,6.5 7.5,7.4 7.5,8 Z
  " />

  <!-- Sparkle 1 (Large Gold Star) -->
  <path transform="translate(180, 220) scale(32)" fill="url(#goldGrad)" filter="url(#starGlow)" d="
    M 18,1.5 C 18,3.8 19.7,5.5 22,5.5 C 19.7,5.5 18,7.2 18,9.5 C 18,7.2 16.3,5.5 14,5.5 C 16.3,5.5 18,3.8 18,1.5 Z
  " />

  <!-- Sparkle 2 (Small Gold Star) -->
  <path transform="translate(180, 220) scale(32)" fill="url(#goldGrad)" filter="url(#starGlow)" d="
    M 21.5,9.5 C 21.5,11 22.5,12 24,12 C 22.5,12 21.5,13 21.5,14.5 C 21.5,13 20.5,12 19,12 C 20.5,12 21.5,11 21.5,9.5 Z
  " />
</svg>
